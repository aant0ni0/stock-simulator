version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./docker/php
    image: php:8.2-fpm
    volumes:
      - .:/var/www
    depends_on:
      - db

  cron:
    build: ./docker/cron
    volumes:
      - ./:/var/www
    depends_on:
      - db


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_sim
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
    db_data: